id: D16
decision: Cross-device sync is optional, uses the owner's own Supabase project over plain fetch, and is single-user
why: The project address and publishable key are entered on each device (or via a setup link) and kept in that device's
  storage, never committed or deployed. Row level security, a password and disabled sign-ups protect the data. Secret
  and service_role keys are refused by the app. A static site cannot keep any secret, so none is ever used.
date: '2026-10-11'
status: active
