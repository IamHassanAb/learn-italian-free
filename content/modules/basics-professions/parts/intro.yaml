id: basics-professions.intro
type: text
text: 'To say what you do, leave out the article: *Sono insegnante. Mio padre è operaio.* Most job names change like other nouns (*cameriere, cameriera*), and these never change: words in *-ista* (*il dentista, la dentista*) and in *-ante* (*l''insegnante*, *il cantante, la cantante*); only the article tells you the gender. Words in *-tore* become *-trice* (*attore, attrice*). Feminine forms of professional titles are debated: *medica* and *dottoressa* are both used, *avvocata* and *avvocatessa* are both accepted (*-essa* can sound ironic for newer titles), and *ingegnera* and *l''ingegnere* are both heard, so the drills accept the common alternatives. More practice: [[res:oic-professions|Online Italian Club, professions]].'
