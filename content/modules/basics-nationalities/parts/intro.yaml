id: basics-nationalities.intro
type: text
text: 'Countries are written with a capital letter (*Italia*), nationalities and languages with a small one (*italiano*, *inglese*). After *in* a singular country loses its article (*vivo in Italia, vado in Cina*), plural names keep it (*negli Stati Uniti*), and after *da* the article stays (*vengo dalla Spagna, dal Portogallo, dall''India*). Nationalities in *-o* change like other adjectives (*italiano, italiana, italiani, italiane*); those in *-ese* and *-e* have one form for men and women (*inglese, inglesi*). *Pakistano* is also written *pachistano*. More practice: [[res:oic-nationalities|Online Italian Club, nationalities]].'
