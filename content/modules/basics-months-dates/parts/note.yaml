id: basics-months-dates.note
type: text
small: true
text: 'Months are not capitalised. *a marzo / in marzo* = in March. Dates use a cardinal number, except the first:
  **il primo ottobre**, **il sette ottobre**. Order is day then month: *Oggi è mercoledì 7 ottobre.* Che data è
  oggi? (standard) / Quanti ne abbiamo oggi? (informal)'
