id: step5-rhythm.bullets
type: bullets
items:
- '**Mon / Wed / Fri:** one Easy Italian street interview. 4 passes: gist, subtitles, shadow 5 lines, make 3 sentences.'
- '**Tue / Thu:** one Caffè Italiano or podcast episode. Italian subtitles on. Retell it in 3 sentences.'
- '**Sat:** something fun: a RaiPlay show, a vlog or music. No tasks. Just stay in Italian.'
- '**Every day in Italy:** speak at least once with a stranger (shop, bar, university).'
