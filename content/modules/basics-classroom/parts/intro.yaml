id: basics-classroom.intro
type: text
text: '*Aula* is the room; *classe* is the group of students (and also the school year), not the room. *Le forbici* (scissors) is always plural. *Gomma* means eraser, and also rubber, a tyre and chewing gum, so Italians often just say *gomma* when they want an eraser. For fun, ask yourself *Che c''è nello zaino?* and answer from memory. More practice: [[res:oic-classroom|Online Italian Club, a classroom objects exercise]].'
