id: basics-family.intro
type: text
text: 'Singular family words drop the article after *mio, tuo, suo...*: *mia madre, mio fratello*. Plurals keep it (*i miei genitori, le mie sorelle*), and so does *loro* (*il loro zio*). Boyfriends, girlfriends and friends are not family words, so they keep it (*il mio fidanzato*, *la mia amica*). Careful: *parente* means relative, not parent. More practice: [[res:oic-family-reading|Online Italian Club, a family and hobbies reading exercise]].'
