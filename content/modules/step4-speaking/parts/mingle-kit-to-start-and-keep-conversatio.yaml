id: step4-speaking.mingle-kit-to-start-and-keep-conversatio
type: table
title: Mingle kit (to start and keep conversations going)
rows:
- - Ciao, sono… Tu come ti chiami? / Piacere!
  - Hi, I'm… What's your name? / Nice to meet you
- - Di dove sei? Da quanto tempo sei qui?
  - Where are you from? How long have you been here?
- - Che cosa studi? Che corso fai?
  - What do you study? Which course?
- - Sto imparando l'italiano. Scusa se faccio errori.
  - I'm learning Italian. Sorry for the mistakes.
- - Mi puoi correggere, per favore?
  - Can you correct me, please?
- - Ti va un caffè? Ci vediamo!
  - Fancy a coffee? See you!
columns:
- Say
- Meaning
