id: pb-overview.patterns
type: table
title: Five flexible patterns to remember
columns:
- Pattern
- Meaning
- Example
rows:
- - Vorrei + noun / infinitive
  - I would like…
  - Vorrei un caffè. / Vorrei aprire un conto.
- - Posso + infinitive?
  - Can I…?
  - Posso pagare con la carta?
- - Dov'è…?
  - Where is…?
  - Dov'è la farmacia?
- - Ho bisogno di…
  - I need…
  - Ho bisogno di aiuto.
- - Quanto costa…?
  - How much does… cost?
  - Quanto costa il biglietto?
