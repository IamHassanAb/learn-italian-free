id: pb-overview.polite-or-informal
type: text
title: Polite or informal
text: Italian distinguishes between speaking informally (tu) and politely (Lei). Use informal wording with friends
  and classmates once you are comfortable. With a landlord, office staff or someone you do not know, polite forms
  such as *Mi scusi*, *Parla inglese?*, *Può aiutarmi?* and *Potrebbe spiegarmi meglio?* are safer.
