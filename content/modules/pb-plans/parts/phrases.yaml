id: pb-plans.phrases
type: phrases
items:
- id: p116
  it: Sei libero oggi?
  en: 'Are you free today? (To a man; to a woman: libera)'
- id: p117
  it: A che ora ci vediamo?
  en: What time shall we meet?
- id: p118
  it: Dove ci incontriamo?
  en: Where shall we meet?
- id: p119
  it: Ti mando un messaggio.
  en: I'll send you a message.
- id: p120
  it: Ti chiamo più tardi.
  en: I'll call you later.
- id: p121
  it: Scusa, sono in ritardo.
  en: Sorry, I'm late. (Informal)
- id: p122
  it: Arrivo tra dieci minuti.
  en: I'll be there in ten minutes.
- id: p123
  it: Aspettami un momento.
  en: Wait for me a moment. (Informal)
- id: p124
  it: Mi dispiace, oggi non posso.
  en: I'm sorry, I can't today.
- id: p125
  it: Magari un'altra volta.
  en: Maybe another time.
- id: p126
  it: Ti va di uscire?
  en: Would you like to go out? (Can sound like a date invitation.)
- id: p127
  it: Andiamo insieme?
  en: Shall we go together?
- id: p128
  it: È stato bello conoscerti.
  en: It was nice meeting you.
- id: p129
  it: Ci sentiamo!
  en: Talk to you soon!
- id: p130
  it: Buona giornata!
  en: Have a nice day!
