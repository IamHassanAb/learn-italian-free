id: step1-cognates.your-study-words-check-the-gender
type: text
title: Your study words (check the gender!)
text: '**il** problema, **il** programma, **il** sistema (masculine despite -a: i problemi, i programmi, i sistemi)
  · **l''**analisi (feminine, same in plural) · **il** database, **il** software (never change) · il metodo, il
  modello, l''algoritmo, il progetto, la tecnologia, l''informazione, l''università, il professore.'
