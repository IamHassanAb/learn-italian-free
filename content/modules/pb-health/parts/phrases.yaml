  it: Ho mal di testa.
  en: I have a headache.
- id: p187
  it: Ho mal di stomaco.
  en: I have a stomachache.
- id: p188
  it: Ho la febbre.
  en: I have a fever.
- id: p189
  it: Da quanto tempo ha questi sintomi?
