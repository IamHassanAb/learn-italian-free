id: scenario-meeting-people.harder
type: bullets
title: Make it harder
items:
- 'Suggest a plan for another day: *Ti va di fare una passeggiata domani?*'
- 'They talk too fast. Ask them to slow down: *Puoi parlare più lentamente, per favore?*'
- 'You missed a sentence. Say: *Non ho capito. Puoi ripetere?*'
