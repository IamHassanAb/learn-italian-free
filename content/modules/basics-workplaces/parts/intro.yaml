id: basics-workplaces.intro
type: text
text: 'To say where you work, use *in*: *Lavoro in un ufficio, in un negozio, in un ospedale*. To say what you do as well, add *come*: *Lavoro come cameriere in un ristorante*. Careful: *officina* is a workshop or garage, not an office (that is *ufficio*). *Studio privato* is a private practice, the place where a dentist or a lawyer sees clients. School is in [[res:oic-school|the school words]] and job titles in [[res:oic-professions|the professions list]]. More practice: [[res:oic-workplaces|Online Italian Club, workplaces]].'
