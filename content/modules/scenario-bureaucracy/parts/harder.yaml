id: scenario-bureaucracy.harder
type: bullets
title: Make it harder
items:
- 'The form is too complicated. Ask for help: *Può aiutarmi a compilare questo modulo?*'
- 'You want to be sure you have everything. Ask: *Devo portare altri documenti?*'
- 'The clerk speaks too fast. Ask: *Può ripetere più lentamente, per favore?*'
