id: step2-retell.rules
type: bullets
title: Keep it simple
items:
- Use the present tense and words you remember from the story. Cognates are welcome.
- Do not translate from English. If you are stuck, say a simpler sentence, or say the missing word in English and carry on.
- New to this? Start with two sentences and build up to four.
- The examples above only show the shape. Your sentences come from the story you just read.
