id: basics-self-test.bullets
type: bullets
items:
- Say today's date and day, the time, and the weather out of the window.
- Count from 1 to 20, then count by tens to 100, then say your own phone number.
- Say the days and months in order, fast, without looking.
- Say 5 greetings and polite phrases as if you were walking into a bar.
