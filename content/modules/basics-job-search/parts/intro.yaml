id: basics-job-search.intro
type: text
text: 'Say *Cerco lavoro* (no *per*) for "I''m looking for a job". In an ad you will see *opportunità di lavoro*, *offerta di lavoro* and *Cercasi personale*; you answer with your *curriculum* and sometimes a *lettera di presentazione*. A *stage* (or *tirocinio*) is an internship. The last group is whole sentences: learn them as blocks and swap one word, for example *Cerco lavoro in una libreria*. Job titles are in [[res:oic-professions|the professions list]]. For listening, try [[res:oic-job-listening|La ricerca di Lucia (A2, with transcript)]].'
