id: basics-school.intro
type: text
text: 'How Italian university works, in numbers: a *laurea* (bachelor''s) takes three years and 180 *crediti* (CFU), a *laurea magistrale* (master''s) two more years and 120 CFU, and a *dottorato* at least three years. One CFU is about 25 hours of work. Exams are marked out of 30 and 18 is a pass; *30 e lode* is the top mark. Say *fare i compiti* (not *do*), *prendere appunti*, *sostenere* or *superare un esame*. More practice: [[res:oic-school|Online Italian Club, school and studying]].'
