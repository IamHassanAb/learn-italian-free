id: basics-colours.intro
type: text
text: 'Most colours agree with the noun: *una casa bianca, due case bianche, un gatto nero, due gatti neri*. Verde has only two forms (*verde, verdi*). Blu, viola, rosa and beige never change (*due macchine blu*). Arancione and marrone take -i in the plural (*marroni, arancioni*), though you will also see them left unchanged, and both are accepted. More practice: [[res:oic-colours|Online Italian Club, colours]].'
