id: basics-colours.intro
type: text
text: 'rosso, arancione, giallo, verde, azzurro (light blue), blu, viola, rosa, marrone, grigio, nero, bianco. Blu,
  viola, rosa, arancione and marrone are treated as invariable (*due macchine blu*); you will still hear *marroni*
  and *arancioni*. Other colours agree with the noun: *una casa bianca, due case bianche, un gatto nero, due gatti
  neri*.'
