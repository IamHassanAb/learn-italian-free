id: basics-hobbies.intro
type: text
text: 'Two easy ways to talk about hobbies: *Mi piace* + the verb (*Mi piace leggere*), or just the verb (*Leggo molto*). Use *giocare a* for games and sports (*giocare a tennis, a scacchi*), *giocare ai videogiochi* for video games, *suonare* for instruments (*suonare la chitarra*), and *andare in* for *bicicletta* and *palestra*. *Passatempo* is the traditional word for a pastime, and *hobby* is used too. More practice: [[res:oic-family-reading|Online Italian Club, a family and hobbies reading exercise]].'
