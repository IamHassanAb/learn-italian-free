claims:
- claim: 'Hobby sentences with levels: Mi piace cucinare (A1); Nel tempo libero leggo molto (A1); Pratico sport regolarmente (A1); Suono la chitarra da anni (A2); Mi piace fare escursioni in montagna (A1); Gioco a scacchi con gli amici (A1); Mi piace molto ballare (A1); Mi piace andare in bicicletta (A1); Gioco ai videogiochi la sera (A1); Gioco a tennis due volte a settimana (A1); Vado in palestra quattro volte a settimana (A1); Corro almeno tre volte a settimana (A2); Mi appassiona la fotografia (A2); Faccio volontariato nel fine settimana (A2); Guardo quasi tutte le partite di calcio (A1); Vado a sciare ogni inverno sulle Alpi (A2); Sto imparando a suonare il pianoforte (A2)'
  source: https://fastitalianlearning.com/phrases/talking-about-hobbies
  verified: '2026-10-28'
- claim: 'Free-time activity words in a school vocabulary lesson: leggere, nuotare, guardare la tv, cucinare, andare al cinema, fare una passeggiata, suonare uno strumento, andare in bicicletta, andare in palestra, uscire con amici, giocare ai videogiochi (written giocare videogiochi there), ascoltare la musica (misspelled in the lesson), correre, calcio, sciare, tempo libero'
  source: https://instruction.meridenk12.org/courses/541acc/4/1/
  verified: '2026-10-28'
- claim: 'passatempo (plural passatempi) is the traditional word for a free-time activity and hobby is the English word often heard today; tempo libero means free time'
  source: https://fastitalianlearning.com/vocabulary/hobbies/passatempo
  verified: '2026-10-28'
- claim: 'Second source for the hobby words and the sentence patterns (Mi piace cucinare, Nel tempo libero leggo molto, Pratico sport regolarmente, Suono la chitarra da anni). Weaker: a list page of uncertain quality'
  source: https://nopbm.pages.dev/en/italian-course/vocabulary/hobbies-vocabulary-in-italian.html
  verified: '2026-10-28'
- claim: 'fare volontariato (to do voluntary work)'
  source: https://www.thelocal.it/20171106/working-in-italy-the-italian-job-speak-you-need-to-know
  verified: '2026-10-28'
- claim: 'NOT individually sourced: the example sentences and their answers; uscire con gli amici (the lesson says uscire con amici); correre has one lesson list and one phrase (Corro almeno tre volte a settimana). The patterns about giocare a / ai, suonare and andare in are read from the sourced sentences, not from a grammar page. Left out: hobbies that need more rules or rarer words (fishing, bocce, origami, patchwork). Worth a native-speaker read (task P01)'
  source: https://fastitalianlearning.com/vocabulary/hobbies/hobby
