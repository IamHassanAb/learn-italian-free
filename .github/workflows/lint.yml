name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check content (ids, references, schema, accents)
        run: python build/lint.py
      - name: Check the plan
        run: python build/plan.py
      - name: App unit tests
        run: node --test app/tests/lib.test.mjs app/tests/drills.test.mjs app/tests/sync.test.mjs app/tests/syncconfig.test.mjs app/tests/translate.test.mjs app/tests/search.test.mjs app/tests/rows.test.mjs app/tests/tiers.test.mjs app/tests/register.test.mjs app/tests/install.test.mjs app/tests/vocabdrills.test.mjs app/tests/modules.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Database schema and security (real Postgres in WebAssembly)
        run: |
          npm install --no-save @electric-sql/pglite
          node tools/sql-check.mjs
